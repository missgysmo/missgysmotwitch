<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Overlay avatars</title>
  <link rel="stylesheet" href="overlay.css?v=20" />
</head>
<body>
  <div id="stage"></div>
  <canvas id="graffiti-canvas"></canvas>
  <div id="chat-overlay">
    <div id="chat-overlay-list"></div>
  </div>
  <div id="activity-feed"><div id="activity-feed-track"></div></div>
  <div id="follow-list"><div id="follow-list-track"></div></div>
  <div id="tamagotchi">
    <img id="tamagotchi-img" alt="" />
    <div id="tamagotchi-bar"><div id="tamagotchi-bar-fill"></div></div>
  </div>
  <div id="raid-card"></div>
  <div id="now-playing">
    <img id="now-playing-art" alt="" />
    <div class="now-playing-info">
      <div id="now-playing-title"></div>
      <div id="now-playing-artist"></div>
    </div>
  </div>
  <div id="event-layer"></div>
  <div id="timer-layer"></div>
  <script src="overlay.js?v=20"></script>
</body>
</html>
