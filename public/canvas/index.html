<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Graffiti collectif</title>
  <link rel="stylesheet" href="canvas.css" />
</head>
<body>
  <main>
    <h1>Graffiti collectif</h1>
    <p>Compose avec les autres followers sur le canvas affiché en direct sur le stream. Réservé aux followers de la chaîne.</p>

    <form id="login-form">
      <label>
        Pseudo Twitch
        <input type="text" id="login" placeholder="ton_pseudo" required autocomplete="off" />
      </label>
      <button type="submit">Vérifier</button>
      <p id="status"></p>
    </form>

    <div id="paint-area" hidden>
      <div class="toolbar">
        <div id="palette"></div>
        <select id="sticker-select"></select>
      </div>

      <div class="toolbar">
        <div class="zoom-controls">
          <button type="button" id="zoom-out">−</button>
          <span id="zoom-level">100%</span>
          <button type="button" id="zoom-in">+</button>
        </div>
        <label class="template-picker">
          Modèle
          <input type="file" id="template-input" accept="image/*" />
        </label>
        <label class="template-opacity" id="template-opacity-wrap" hidden>
          Opacité
          <input type="range" id="template-opacity" min="0" max="100" value="40" />
        </label>
        <button type="button" id="template-clear" hidden>Retirer le modèle</button>
      </div>

      <div class="canvas-wrap">
        <div class="canvas-stage" id="canvas-stage">
          <img id="template-img" hidden />
          <canvas id="canvas"></canvas>
          <div id="grid-overlay"></div>
        </div>
      </div>
      <p id="cooldown-info" class="hint"></p>
    </div>
  </main>

  <script src="canvas.js"></script>
</body>
</html>
