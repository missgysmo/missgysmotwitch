<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MissGysmo — Avatars du chat</title>
  <link rel="stylesheet" href="home.css" />
</head>
<body>
  <main>
    <header>
      <h1>missgysmo<span>.avatars</span></h1>
      <p class="tagline">Ton avatar se balade sur le stream pendant que tu chat ✨</p>
    </header>

    <section class="cards">
      <a class="card" href="/customize/">
        <span class="card-icon">👾</span>
        <h2>Choisir mon avatar</h2>
        <p>Pseudo Twitch, personnage, couleur — réservé aux followers de la chaîne.</p>
      </a>

      <a class="card card-admin" href="/settings/">
        <span class="card-icon">🔒</span>
        <h2>Administration</h2>
        <p>Réglages de l'overlay, zones, vitesse, events. Accès réservé.</p>
      </a>
    </section>

    <footer>
      <p>propulsé par un chaudron numérique 🔮</p>
    </footer>
  </main>
</body>
</html>
